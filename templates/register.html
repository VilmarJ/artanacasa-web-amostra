<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Web Artana</title>
    <link rel="stylesheet" href="/static/styles_index.css">
</head>
<body>
    <main class="container">
        <form action="/cadastro" method="POST">
            <h1>Criar Conta</h1>

            {% if erro %}
                <p style="color:red; text-align:center;">{{ erro }}</p>
            {% endif %}

            <div class="input-box">
                <input name="usuario" placeholder="Usuário" required>
            </div>

            <div class="input-box">
                <input name="email" type="email" placeholder="E-mail" required>
            </div>

            <div class="input-box">
                <input name="senha" type="password" placeholder="Senha" required>
            </div>

            <div class="input-box">
                <input name="confirmar" type="password" placeholder="Confirme a Senha" required>
            </div>

            <button class="login" type="submit">Cadastrar</button>

            <div class="register-link">
                <p>Já tem conta? <a href="/">Entrar</a></p>
            </div>
        </form>
    </main>
</body>
</html>
